version: "3.9"

services:
  api:
    build:
      context: .
      target: runtime        # use the final, non-root runtime stage
    image: post-processing-ai-quality-api:dev
    container_name: quality-api
    ports:
      - "8000:8000"
    env_file:
      - .env                  # copy .env.example → .env and fill in your keys
    environment:
      DEBUG: "true"
    volumes:
      # Hot-reload: mount source code so changes take effect without rebuild
      - ./app:/app/app:ro
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --reload
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
