# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
version: "3.9"

services:
  api:
    image: ghcr.io/m01126057061-lang/post-processing-ai-quality-api:latest
    environment:
      DEBUG: "false"
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --workers 4
    restart: always
    deploy:
      resources:
        limits:
          memory: 2g
